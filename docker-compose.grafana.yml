services:
    docker-socket-proxy:
        image: tecnativa/docker-socket-proxy:0.2.0
        environment:
            CONTAINERS: 1
            SERVICES: 1
            TASKS: 1
            NETWORKS: 1
            NODES: 0
            EVENTS: 1
            POST: 0
            BUILD: 0
            COMMIT: 0
            CONFIGS: 0
            DISTRIBUTION: 0
            EXEC: 0
            IMAGES: 0
            INFO: 1
            SECRETS: 0
            SWARM: 0
            VOLUMES: 0
            LOG_LEVEL: info
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - monitoring

    loki-init:
        image: alpine:3.23
        user: "0"
        command: chown -R 10001:10001 /loki/data
        volumes:
            - loki-data:/loki/data
        networks:
            - monitoring

    loki:
        image: grafana/loki:3.6
        volumes:
            - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
            - loki-data:/loki/data
        command: -config.file=/etc/loki/local-config.yaml
        depends_on:
            loki-init:
                condition: service_completed_successfully
        networks:
            - monitoring

    alloy:
        image: grafana/alloy:v1.13.1
        environment:
            DOCKER_HOST: tcp://docker-socket-proxy:2375
        volumes:
            - ./monitoring/config.alloy:/etc/alloy/config.alloy
        command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
        depends_on:
            - docker-socket-proxy
        networks:
            - monitoring

    grafana:
        image: grafana/grafana:12.3
        ports:
            - "3000:3000"
        environment:
            GF_LOG_LEVEL: warn
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Admin123}
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/logs-dashboard.json
        volumes:
            - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
            - ./monitoring/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
            - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json
            - grafana-data:/var/lib/grafana
        depends_on:
            - loki
        networks:
            - monitoring

networks:
    monitoring:
        driver: bridge

volumes:
    grafana-data:
    loki-data:
